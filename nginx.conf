# Compression for text assets and API JSON (images/fonts are already compressed). Event streams are not listed, so SSE is untouched.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css text/plain text/xml application/javascript application/json application/manifest+json image/svg+xml;

# Files requested with ?v=<release> (app.js, style.css, tailwind.css) change URL on every release, so they can be cached for a year.
# Without ?v= the browser must revalidate.
map $arg_v $versioned_cache {
    default "public, max-age=31536000, immutable";
    ""      "no-cache";
}

# Rate limiting zone for unauthenticated public menu traffic
limit_req_zone $binary_remote_addr zone=public_api_limit:10m rate=15r/s;

# Microcache for the public customer menu. Customers and QR scans all ask for the same data, so nginx answers them from its own
# copy and the backend and the cafe's database see about one request per 10 seconds however many people look.
# The key holds the cafe (it is in the URL) and the branch (?branch=): one cafe's or branch's menu is never shown to another.
proxy_cache_path /var/cache/nginx/public_menu levels=1:2 keys_zone=public_menu:2m max_size=20m inactive=30m use_temp_path=off;

# Only the menu, its status and the logo may be cached. Everything else under /api/public/ (unsubscribe links)
# must always reach the backend.
map $uri $public_not_cacheable {
    default 1;
    ~^/api/public/[a-z0-9-]+/(menu|menu/status|logo)$ 0;
}

# Login throttle (first line of defence against password guessing; the app also locks accounts after repeated failures).
# Keyed on the real visitor: Cloudflare's header when the app is behind a tunnel, otherwise the socket address.
map $http_cf_connecting_ip $login_limit_key {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}
limit_req_zone $login_limit_key zone=login_limit:10m rate=20r/m;


server {
    listen 80;
    server_name localhost;
    server_tokens off;
    client_max_body_size 6m;

    # Embedded Docker DNS resolver for dynamic service discovery and resilient Swarm startup
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_upstream "http://backend:8080";

    # Global Security Response Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    # Health check endpoint for Swarm and load balancers (zero overhead, no access log spam)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Public Customer Menu (/menu and /menu.html)
    location = /menu {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
    }

    location = /menu.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
    }

    # Public Customer Menu API: Strict rate limiting + GET-only enforcement + dynamic upstream caching
    location /api/public/ {
        # POST is only for the one-click marketing unsubscribe (/api/public/{cafe}/customers/unsubscribe); the backend answers
        # everything else under here as GET.
        limit_except GET HEAD POST OPTIONS {
            deny all;
        }
        limit_req zone=public_api_limit burst=30 nodelay;
        limit_req_status 429;
        error_page 403 = @api_forbidden;
        error_page 429 = @api_busy;
        error_page 502 503 504 = @api_unavailable;

        proxy_cache public_menu;
        proxy_cache_key $scheme$host$uri$arg_branch;
        proxy_no_cache $public_not_cacheable;
        proxy_cache_bypass $public_not_cacheable;
        proxy_cache_valid 200 10s;
        proxy_cache_valid 403 5s;
        proxy_ignore_headers Cache-Control Expires Vary;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # The answer must not depend on who asks.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Accept-Encoding "";

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Prevent tech fingerprint leakage
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;

        # Security headers
        add_header X-Menu-Cache $upstream_cache_status always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Progressive Web App Assets (sw.js & manifest.json)
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Service-Worker-Allowed "/";
        add_header Content-Type "application/javascript";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Type "application/manifest+json";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Never serve build/config files that live next to the app files (defence in depth; the image also excludes most of them).
    location ~* ^/(Dockerfile|nginx\.conf|package(-lock)?\.json|\.dockerignore|tools(/|$)|node_modules(/|$))|\.md$ {
        return 404;
    }
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Third-party libraries bundled with the app. The directory name carries the library version, so files never change in place.
    location ^~ /vendor/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Vite's build output (assets/<name>-<content hash>.js|css|png ...): the name changes whenever the content does.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Application scripts and styles: long cache when requested with ?v=, otherwise revalidate (sw.js has its own exact-match rule below).
    location ~* \.(?:js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control $versioned_cache;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Images and icons: a week, then revalidate.
    location ~* \.(?:png|ico|svg|webp|jpg|jpeg|woff2)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Main POS single-page application
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https: wss:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
    }

    # Notification and order-change streams (Server-Sent Events): must not be buffered or cut off by the default 60s read timeout.
    location ~ ^/api/(notifications|bills)/stream$ {
        error_page 502 503 504 = @api_unavailable;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location = /api/auth/login {
        limit_req zone=login_limit burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @api_busy;
        error_page 502 503 504 = @api_unavailable;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Authenticated POS API Proxy with Swarm failover & keepalive connection pooling
    location /api/ {
        error_page 502 503 504 = @api_unavailable;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;

        # Prevent duplicate security headers and tech fingerprint leakage
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ---- Error pages. People get the cafe-themed pages (public/errors/NNN.html). The API is different: the app reads its answers
    # as JSON, so errors that nginx itself makes for /api/ (server down, too many requests) are small JSON bodies.
    # Errors the backend sends are passed through untouched.
    error_page 400 /errors/400.html;
    error_page 401 /errors/401.html;
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 408 /errors/408.html;
    error_page 413 /errors/413.html;
    error_page 414 /errors/414.html;
    error_page 429 /errors/429.html;
    error_page 500 /errors/500.html;
    error_page 502 /errors/502.html;
    error_page 503 /errors/503.html;
    error_page 504 /errors/504.html;

    location ^~ /errors/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"The cafe server is not answering right now. Please try again in a moment.","status":503}';
    }
    location @api_busy {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
        return 429 '{"error":"Too many attempts. Please wait a minute and try again.","status":429}';
    }
    location @api_forbidden {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 403 '{"error":"This request is not allowed.","status":403}';
    }
}
