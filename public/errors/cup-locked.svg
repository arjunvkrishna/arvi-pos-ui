<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="A cheerful coffee cup">
<style>
  .ink{fill:#4a2c1a}.line{stroke:#4a2c1a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.face .ink,.face circle:not([fill=none]){fill:#4a2c1a}
  .cupbody{fill:#fffaf2;stroke:#4a2c1a;stroke-width:6;stroke-linejoin:round}.saucer{fill:#f3e3cc;stroke:#4a2c1a;stroke-width:6}
  .coffee{fill:#8a5a3a}.amber{fill:#f59e0b;stroke:#4a2c1a;stroke-width:4;stroke-linejoin:round}.drip{fill:#8a5a3a;stroke:#4a2c1a;stroke-width:4}
  .steam{fill:none;stroke:#c8a98a;stroke-width:6;stroke-linecap:round;opacity:.9;animation:rise 3.2s ease-in-out infinite}.steam.b{animation-delay:-1.1s}.steam.c{animation-delay:-2.1s}
  .mark{font:800 34px sans-serif;fill:#f59e0b;stroke:#4a2c1a;stroke-width:2;paint-order:stroke;animation:bob 2.4s ease-in-out infinite}.mark.small{font-size:22px;animation-delay:-1.2s}
  .zzz{animation:float 2.8s ease-in-out infinite}.stars{transform-origin:100px 80px;animation:spin 5s linear infinite}
  .wobble{transform-origin:100px 190px;animation:wobble 3.6s ease-in-out infinite}
  @keyframes rise{0%{transform:translateY(8px);opacity:0}30%{opacity:.9}100%{transform:translateY(-14px);opacity:0}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes float{0%{transform:translate(0,6px);opacity:0}40%{opacity:1}100%{transform:translate(8px,-14px);opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes wobble{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
  @media (prefers-color-scheme:dark){.cupbody{fill:#fff3e0}.saucer{fill:#e9d3b4}.steam{stroke:#e2c8aa}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<ellipse cx="100" cy="196" rx="70" ry="14" class="saucer"/>
<g class="wobble">
<path d="M150 108 q34 -4 34 22 q0 28 -40 28" fill="none" class="line" stroke-width="9"/><path d="M150 108 q34 -4 34 22 q0 28 -40 28" fill="none" stroke="#fffaf2" stroke-width="3" opacity=".0"/>
<path class="cupbody" d="M36 84 h128 v50 a58 58 0 0 1 -58 58 h-12 a58 58 0 0 1 -58 -58 z"/>
<ellipse cx="100" cy="84" rx="64" ry="12" class="coffee" stroke="#4a2c1a" stroke-width="6"/>
<g class="face"><path d="M72 118 q10 -8 20 0" fill="none" class="line"/><path d="M108 118 q10 -8 20 0" fill="none" class="line"/><path d="M88 142 h24" fill="none" class="line"/></g><g class="lock" transform="translate(132 150)"><rect x="0" y="12" width="34" height="28" rx="6" class="amber"/><path d="M7 12 v-8 a10 10 0 0 1 20 0 v8" fill="none" class="line"/><circle cx="17" cy="26" r="4" class="ink"/></g>
<path class="steam" d="M78 64 q-10 -14 0 -26 t0 -26"/><path class="steam b" d="M100 60 q-10 -14 0 -26 t0 -26"/><path class="steam c" d="M122 64 q-10 -14 0 -26 t0 -26"/>
</g></svg>
